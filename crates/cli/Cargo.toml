[package]
name = "quill_cli"
description = "Duck Quill on the command line: render painting scripts, check them, look inside .quill files. No window or graphics card needed."
version.workspace = true
edition.workspace = true
rust-version.workspace = true

# The code is a library (src/lib.rs) so that two programs can run it:
# `quill`, and `art-cli`, its old name, kept so agents' old scripts still work.
[lib]
name = "quill_cli"
path = "src/lib.rs"

[[bin]]
name = "quill"
path = "src/main.rs"

[[bin]]
name = "art-cli"
path = "src/bin/art-cli.rs"

[dependencies]
quill_engine.workspace = true
serde_json = { version = "1", features = ["preserve_order"] }

[dev-dependencies]
serde_json = "1"
